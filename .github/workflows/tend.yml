name: weekly tending
on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  discussions: write
  id-token: write
jobs:
  tend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: "${{ secrets.TALLY_TOKEN }}" }
      - name: Check the key exists
        id: key
        env: { KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          if [ -z "$KEY" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Tend
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TALLY_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}  SITE: https://mandajayde.github.io/receipts
            Follow prompts/weekly.md exactly.
          claude_args: "--max-turns 60 --allowedTools Bash(git:*),Bash(gh:*),Bash(python3:*),Edit,Read,Write,Glob,Grep,WebFetch,WebSearch"
