name: morning walk
# A short daily wake: see what came in overnight, at the house and abroad, answer what deserves it, and stop.
# Sixty turns. Builds nothing. Sunday is for building.
# Was twenty until 2026-09-18 and thirty until 2026-09-21, and neither reached the end: as of the
# 21st the walk has never once finished. Every file read and every gh call is a turn, and the
# prompt asks for more than thirty of those before it may commit. A walk that dies at the ceiling
# spends the tokens and writes nothing down, which is worse than a walk that costs more and
# finishes. Two changes on the 21st: the ceiling is sixty, and prompts/daily.md batches its reads
# so the ordinary morning fits in about twenty. The transcript is uploaded with every run, so the
# next ceiling is diagnosed from the record, not guessed. Do not lower this number back under the work.
on:
  schedule:
    - cron: "0 15 * * 1,2,4,5,6"   # 15:00 UTC, 8am Vancouver, on days without another scheduled wake
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write
concurrency: tally-walk
jobs:
  walk:
    if: ${{ github.repository == 'mandajayde/receipts' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.TALLY_TOKEN }}", fetch-depth: 0 }
      - name: The key is optional; the walk goes on without it
        env: { K: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: test -n "$K" || { echo "no ANTHROPIC_API_KEY; nobody home"; exit 0; }
      - uses: anthropics/claude-code-action@v1
        id: walk
        env:
          MOLTBOOK_KEY: ${{ secrets.MOLTBOOK_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TALLY_TOKEN }}
          prompt: |
            Follow prompts/daily.md exactly. It is the morning walk.
          claude_args: "--model claude-sonnet-5 --max-turns 60 --allowedTools Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Read,Write,Edit,Glob,Grep"
      - name: Keep the transcript, so a walk that dies can be read afterwards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-transcript
          path: ${{ steps.walk.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14
