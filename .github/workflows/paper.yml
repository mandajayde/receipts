name: morning paper
# Every day: one new agent-related paper from arXiv, read, summarised as a note, shelved in the reading room.
# tally reads and writes; this workflow files the logbook entry with the real turns and cost, commits and pushes.
# The shelf (rooms/reading.json) is the memory of what has been read.
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC, 7am Vancouver, an hour before the walk
    - cron: "0 18 * * *"   # and again at 11am, in case GitHub dropped the first: see the shelf check
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: tally-paper
jobs:
  read:
    if: ${{ github.repository == 'mandajayde/receipts' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.TALLY_TOKEN }}", fetch-depth: 0 }
      - name: The key is optional; no key, no paper
        env: { K: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: test -n "$K" || { echo "no ANTHROPIC_API_KEY; nobody home"; exit 0; }
      # The second cron must be free. If today is already on the shelf, this run costs nothing
      # and says so, so the backstop can never produce two papers in one day.
      - id: today
        name: Has today already been read
        run: |
          if python3 -c "
          import json,datetime,sys
          d=json.load(open('rooms/reading.json'))
          t=datetime.date.today().isoformat()
          sys.exit(0 if any(l.get('at')==t for l in d['links']) else 1)"; then
            echo "read=yes" >> "$GITHUB_OUTPUT"; echo "Today is already on the shelf. Nothing to do."
          else
            echo "read=no" >> "$GITHUB_OUTPUT"
          fi
      # A day with nothing new to read is a quiet day, not a broken one. This used to exit 78,
      # which Actions treats as a failure, so an ordinary quiet day painted the run red and
      # taught us to ignore red.
      - id: candidates
        name: Is there anything new to read
        if: ${{ steps.today.outputs.read == 'no' }}
        run: |
          # Keep the two apart: nothing new to read is a quiet day, and arxiv refusing to answer
          # is a quiet day too, but one worth seeing in the run. Neither is a broken build.
          python3 tools/papers.py find --max 3 >/tmp/candidates.json 2>/tmp/why.txt || true
          n=$(python3 -c "import json;print(len(json.load(open('/tmp/candidates.json'))))" 2>/dev/null || echo 0)
          if [ -s /tmp/why.txt ]; then echo "::notice::$(cat /tmp/why.txt)"; fi
          echo "$n candidates"
          echo "found=$n" >> "$GITHUB_OUTPUT"
      - id: paper
        if: ${{ steps.today.outputs.read == 'no' && steps.candidates.outputs.found != '0' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.TALLY_TOKEN }}
          prompt: |
            Follow prompts/paper.md exactly. It is the morning paper.
          claude_args: "--model claude-sonnet-5 --max-turns 30 --allowedTools Bash(git:*),Bash(python3:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Read,Write,Edit,Glob,Grep"
      - name: Keep the transcript
        if: ${{ always() && steps.paper.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: morning-paper-transcript
          path: ${{ steps.paper.outputs.execution_file }}
          retention-days: 90
      - name: File the entry, commit, push
        if: ${{ always() && steps.today.outputs.read == 'no' && steps.candidates.outputs.found != '0' }}
        env: { EXEC: "${{ steps.paper.outputs.execution_file }}" }
        run: |
          git config user.name "tally"; git config user.email "312784285+manda-builder-bot@users.noreply.github.com"
          python3 tools/keep_paper.py "$EXEC"
          git add notes rooms/reading.json MEMORY.md receipts/tally
          git diff --cached --quiet && { echo "nothing to keep"; exit 0; }
          git commit -qm "The morning paper: $(python3 -c "import json;l=json.load(open('rooms/reading.json'))['links'];print(l[0]['title'] if l else 'a note')")"
          git pull -q --rebase origin main && git push -q origin main
