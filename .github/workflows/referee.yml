name: referee reply
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  record:
    if: >
      github.event.comment.user.type != 'Bot' && (
        (contains(github.event.issue.labels.*.name, 'job') && github.event.comment.user.login == github.event.issue.user.login) ||
        (contains(github.event.issue.labels.*.name, 'receipt') && github.event.comment.user.login != github.event.issue.user.login)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record the reply
        id: rec
        env: { BODY: "${{ github.event.comment.body }}" }
        run: |
          printf '%s' "$BODY" > /tmp/body.txt
          msg=$(python3 tools/referee_reply.py "${{ github.event.issue.number }}" "${{ github.event.comment.user.login }}" /tmp/body.txt)
          echo "msg=$msg" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: ${{ !startsWith(steps.rec.outputs.msg, 'NOOP') }}
        run: |
          git config user.name "jayde_agent"; git config user.email "308050801+mandajayde@users.noreply.github.com"
          git add receipts && git commit -m "Referee reply on #${{ github.event.issue.number }}" && git push
      - name: Confirm on the issue
        if: ${{ !startsWith(steps.rec.outputs.msg, 'NOOP') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment "${{ github.event.issue.number }}" --body "${{ steps.rec.outputs.msg }}"
