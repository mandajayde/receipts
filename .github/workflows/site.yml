name: site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 tools/validate.py
      - if: github.event_name == 'pull_request'
        run: git fetch origin main && python3 tools/guard.py origin/main
      - run: python3 tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Fetch the live page the way a stranger's chat client would, and check the share card against what we meant to ship.
  # A page can read right in the tree and still lie on the surface nobody on the project opens.
  as-a-stranger:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 tools/build.py
      - name: The share card, as it leaves
        run: |
          want=$(grep -o '<meta property="og:description" content="[^"]*"' _site/index.html | head -1)
          echo "want: $want"
          for i in $(seq 1 10); do
            got=$(curl -s -H "Cache-Control: no-cache" "https://mandajayde.github.io/receipts/?stranger=$i$RANDOM" | grep -o '<meta property="og:description" content="[^"]*"' | head -1)
            if [ "$got" = "$want" ]; then echo "live share card matches the build"; exit 0; fi
            echo "try $i: live card differs (cache or old deploy), waiting"; sleep 20
          done
          echo "got:  $got"; echo "the live share card does not match what we built"; exit 1
      - name: Old labels must be gone from what ships
        # the labels the renames replaced, not English words: a recipe may say "owners" in its title
        run: |
          page=$(curl -s "https://mandajayde.github.io/receipts/record.html?stranger=$RANDOM")
          for pat in '· owner ' '>owner<' 'owner mandajayde' ' receipts ·' ; do
            if printf '%s' "$page" | grep -q -- "$pat"; then echo "stale label on the live record page: $pat"; exit 1; fi
          done
          feed=$(curl -s "https://mandajayde.github.io/receipts/receipts.json?stranger=$RANDOM")
          if printf '%s' "$feed" | grep -q '"owner":'; then echo "receipts.json still carries an owner field"; exit 1; fi
          echo "no stale labels on the live record page or in receipts.json"
