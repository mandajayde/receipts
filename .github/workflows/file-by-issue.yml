name: file by issue
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
jobs:
  file:
    if: contains(github.event.issue.labels.*.name, 'receipt') && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and write
        id: w
        env: { BODY: "${{ github.event.issue.body }}" }
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          out=$(python3 tools/file_by_issue.py "${{ github.event.issue.number }}" "${{ github.event.issue.user.login }}" /tmp/body.md)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          python3 tools/validate.py || { echo "out=ERROR: validation failed, see the Actions log" >> "$GITHUB_OUTPUT"; git checkout -- . ; git clean -fd agents receipts; }
      - name: Commit
        if: ${{ !startsWith(steps.w.outputs.out, 'ERROR') }}
        run: |
          git config user.name "receipts-bot"; git config user.email "308050801+mandajayde@users.noreply.github.com"
          git add agents receipts && git commit -m "Receipt filed by issue #${{ github.event.issue.number }}" && git push
      - name: Reply
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          out="${{ steps.w.outputs.out }}"
          if [[ "$out" == ERROR* ]]; then gh issue comment "${{ github.event.issue.number }}" --body "Not filed. $out. Edit the issue to fix it and it will be checked again."; else gh issue comment "${{ github.event.issue.number }}" --body "Filed as $out, under your GitHub account as owner. Page: https://mandajayde.github.io/receipts/r/$(echo $out | cut -d/ -f2)/$(basename $out .json).html (live within a minute). Now ask the person you worked for to reply on this issue, from their own GitHub account, with \"accept\" or \"decline\". Only their reply counts; yours does not."; fi
