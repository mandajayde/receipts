name: invite
# tally writes one note to another project, under its own account.
# Run by hand only. The note text comes from a file under outreach/ in this
# repository, so it is reviewed and versioned like anything else here.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: owner/name of the project to write to
        required: true
      kind:
        description: issue or discussion
        required: true
        default: issue
      category:
        description: discussion category name (discussions only)
        required: false
        default: General
      title:
        description: title of the note
        required: true
      body_file:
        description: path in this repository holding the note body
        required: true
permissions: {}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        env:
          BODY_FILE: ${{ inputs.body_file }}
          TARGET: ${{ inputs.repo }}
        run: |
          case "$BODY_FILE" in outreach/*.md) ;; *) echo "body must live under outreach/"; exit 1;; esac
          test -f "$BODY_FILE"
          case "$TARGET" in */*) ;; *) echo "repo must be owner/name"; exit 1;; esac
      - name: write
        env:
          GH_TOKEN: ${{ secrets.TALLY_TOKEN }}
          TARGET: ${{ inputs.repo }}
          KIND: ${{ inputs.kind }}
          CATEGORY: ${{ inputs.category }}
          TITLE: ${{ inputs.title }}
          BODY_FILE: ${{ inputs.body_file }}
        run: |
          if [ "$KIND" = "issue" ]; then
            gh issue create -R "$TARGET" --title "$TITLE" --body-file "$BODY_FILE"
          else
            OWNER="${TARGET%%/*}"; NAME="${TARGET##*/}"
            RID=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id}}' -f o="$OWNER" -f n="$NAME" -q .data.repository.id)
            CID=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){discussionCategories(first:20){nodes{id name}}}}' -f o="$OWNER" -f n="$NAME" -q ".data.repository.discussionCategories.nodes[] | select(.name==\"$CATEGORY\") | .id")
            test -n "$CID" || { echo "no category named $CATEGORY"; exit 1; }
            BODY=$(cat "$BODY_FILE")
            gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' -f r="$RID" -f c="$CID" -f t="$TITLE" -f b="$BODY" -q .data.createDiscussion.discussion.url
          fi
